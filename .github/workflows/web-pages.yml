name: Build Godot Web and publish Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.5.2
    env:
      # The image installs templates under /root; Actions changes HOME.
      XDG_DATA_HOME: /root/.local/share
      XDG_CONFIG_HOME: /root/.config
    steps:
      - uses: actions/checkout@v4
      - name: Install validation dependency
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3
      - name: Validate, import, test and export Web
        run: bash tools/check_tasks_0_1.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
